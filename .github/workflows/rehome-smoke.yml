          python -m pytest -q core/tests/test_d3_feature_intents.py core/tests/test_d3_feature_intents_http.py core/tests/test_account_consent_identity_safety.py core/tests/test_ai_egress_boundary_gate.py

  # Mandatory full OPFS restoration on a supporting platform; Linux must
  # independently attest supported restoration or exact fail-closed capability.
  phase1-d1-macos-storage:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'migration/iamina-snapshot-20261123' && (github.head_ref == 'phase1/d1-backup' || github.head_ref == 'phase1/integration-web') }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Attest macOS source and browser environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
          sw_vers
          python -m venv "$RUNNER_TEMP/d1-macos-venv"
          "$RUNNER_TEMP/d1-macos-venv/bin/python" -m pip install playwright==1.55.0
          "$RUNNER_TEMP/d1-macos-venv/bin/python" -m playwright install chromium webkit
      - name: Probe OPFS capability and verify encrypted archive restart
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/d1-macos-venv/bin/python" frontend/tool/d1_opfs_capability_probe.py
          "$RUNNER_TEMP/d1-macos-venv/bin/python" frontend/tool/d1_archive_browser_probe.py

  # Web-only qualification: this runner is needed for the reference WebKit
  # browser engine, not a native macOS application or separate product target.
  # Linux WebKit port failures remain recorded; explicit diagnostic-all mode
  # reproduces them without substituting them for Safari-target evidence.
  phase1-d2-macos-webkit:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'migration/iamina-snapshot-20261123' && (github.head_ref == 'phase1/d2-guest' || github.head_ref == 'phase1/integration-web') }}
    runs-on: macos-15
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      D2_BROWSER_TARGET: webkit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Attest source and pinned Flutter SDK
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
          sw_vers
          git clone --depth 1 --branch 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "cc0734ac716fbb8b90f3f9db8020958b1553afa7"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build identical D2 candidate flags
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter build web --release --no-pub --no-web-resources-cdn --dart-define=IAMINA_D2_GUEST_CANDIDATE=true --dart-define=API_BASE_URL=http://127.0.0.1:8000
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: D2 Web WebKit mobile-first then desktop
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/d2-browser-venv"
          "$RUNNER_TEMP/d2-browser-venv/bin/python" -m pip install playwright==1.55.0 Pillow==11.3.0
          "$RUNNER_TEMP/d2-browser-venv/bin/python" -m playwright install webkit
          "$RUNNER_TEMP/d2-browser-venv/bin/python" frontend/tool/d2_guest_browser_probe.py
      - name: D1 actual Drift encrypted checkpoint — webkit
        if: ${{ github.head_ref == 'phase1/integration-web' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cd frontend
          flutter build web --release --no-pub --no-web-resources-cdn --target=tool/d1_runtime_probe.dart --output="$RUNNER_TEMP/d1-runtime-web"
          cp tool/d1_archive_candidate.mjs tool/d1_checkpoint_candidate.mjs "$RUNNER_TEMP/d1-runtime-web/"
          cd ..
          D1_RUNTIME_ENGINE=webkit D1_RUNTIME_WEB="$RUNNER_TEMP/d1-runtime-web" "$RUNNER_TEMP/d2-browser-venv/bin/python" frontend/tool/d1_runtime_browser_probe.py
      - name: Retain macOS D2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2-macos-webkit-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/d2-browser-proof/
          if-no-files-found: error
