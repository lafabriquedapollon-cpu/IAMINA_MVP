name: IAMINA Rehome Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/rehome-smoke.yml'
      - 'backend/**'
      - 'scripts/**'
      - 'frontend/**'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest checked-out source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'SOURCE_SHA=%s\n' "$actual_sha"

      - name: Verify source tree and Python syntax (static only)
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          root = Path('.')
          for name in ('frontend/pubspec.yaml', 'backend/manage.py'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing required source: {name}')
          files = [*Path('backend').rglob('*.py'), *Path('scripts').rglob('*.py')]
          if len(files) < 900:
              raise SystemExit(f'Unexpected Python source count: {len(files)}')
          for item in files:
              ast.parse(item.read_text(encoding='utf-8'), filename=str(item))
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = [p for p in tracked if p and (Path(p).name.startswith('.env') or p.endswith(('.pem', '.p12', '.pfx', '.sqlite', '.sqlite3')))]
          if forbidden:
              raise SystemExit(f'Forbidden tracked paths: {len(forbidden)} (names withheld)')
          workflows = [p.name for p in Path('.github/workflows').iterdir() if p.is_file()]
          if workflows != ['rehome-smoke.yml']:
              raise SystemExit('Unexpected active workflow(s)')
          print(f'SOURCE_CONTRACT_PASS: {len(files)} Python files parsed; tracked path guard PASS')
          PY

      - name: Run independent standard-library source regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -q

  flutter-web-baseline:
    needs: snapshot-source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest source and install pinned Flutter SDK
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
          git clone --depth 1 --branch 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = cc0734ac716fbb8b90f3f9db8020958b1553afa7
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Resolve exact locked dependencies
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos --no-pub
      - name: Targeted synthetic Flutter VM regressions
        run: |
          flutter test --no-pub --reporter expanded \
            test/data/drift/patient_vault_scope_test.dart \
            test/data/drift/patient_vault_profile_write_isolation_test.dart \
            test/services/patient_vault_session_controller_test.dart \
            test/services/sync_service_test.dart

      - name: Build Web without deployment or CDN
        run: flutter build web --release --no-pub --no-web-resources-cdn --dart-define=API_BASE_URL=http://127.0.0.1:8000
      - name: Verify PWA files
        run: |
          set -euo pipefail
          for f in index.html manifest.json flutter_bootstrap.js main.dart.js iamina_service_worker.js sqlite3.wasm drift_worker.js; do
            test -s "build/web/$f"
          done
          echo R2_FLUTTER_BUILD_PASS


      - name: Install pinned Playwright Chromium and WebKit
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r2-browser-venv"
          "$RUNNER_TEMP/r2-browser-venv/bin/python" -m pip install playwright==1.55.0
          "$RUNNER_TEMP/r2-browser-venv/bin/python" -m playwright install --with-deps chromium webkit
      - name: Real browser first-use baseline FR and AR
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          "$RUNNER_TEMP/r2-browser-venv/bin/python" - <<'PY'
          import hashlib
          import http.server
          import json
          import os
          import pathlib
          import threading
          from playwright.sync_api import sync_playwright

          web = pathlib.Path("frontend/build/web").resolve()
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "r2-browser-proof"
          proof.mkdir()
          assert (web / "index.html").is_file()
          results = []
          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=str(web), **kwargs)
              def log_message(self, *_args):
                  pass

          with http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler) as server:
              worker = threading.Thread(target=server.serve_forever, daemon=True)
              worker.start()
              origin = f"http://127.0.0.1:{server.server_address[1]}"
              try:
                  with sync_playwright() as pw:
                      for engine in ("chromium", "webkit"):
                          browser = getattr(pw, engine).launch(headless=True)
                          try:
                              for locale, cta in (("fr-FR", "Configurer cet appareil"),
                                                  ("ar-MA", "إعداد هذا الجهاز")):
                                  for width, height in ((390, 844), (1180, 860)):
                                      label = f"{engine}-{locale}-{width}x{height}"
                                      result = dict(engine=engine, browser_version=browser.version,
                                                    locale=locale, viewport=[width, height],
                                                    source_sha=os.environ["EXPECTED_SHA"],
                                                    result="FAIL")
                                      results.append(result)
                                      context = browser.new_context(
                                          locale=locale, viewport={"width": width, "height": height},
                                          device_scale_factor=1, service_workers="block")
                                      blocked, errors = [], []
                                      page = context.new_page()
                                      page.on("pageerror", lambda err: errors.append(str(err)))
                                      def local_only(route):
                                          request = route.request
                                          url = request.url
                                          if url.startswith(("data:", "blob:")):
                                              route.continue_()
                                          elif (url.startswith(origin + "/") and
                                                request.method in ("GET", "HEAD") and
                                                "/api/" not in url.lower()):
                                              route.continue_()
                                          else:
                                              blocked.append((request.method, "/api/" in url.lower()))
                                              route.abort()
                                      context.route("**/*", local_only)
                                      try:
                                          response = page.goto(origin, wait_until="domcontentloaded", timeout=60000)
                                          assert response and response.status == 200
                                          page.wait_for_selector("flutter-view, flt-glass-pane", timeout=60000)
                                          placeholder = page.locator("flt-semantics-placeholder")
                                          if placeholder.count():
                                              placeholder.evaluate("(element) => element.click()")
                                          button = page.get_by_role("button", name=cta, exact=True)
                                          button.wait_for(state="visible", timeout=30000)
                                          assert button.is_enabled()
                                          page.wait_for_timeout(500)
                                          assert not errors, "JavaScript page errors"
                                          assert not any(m not in ("GET", "HEAD", "OPTIONS") or api
                                                         for m, api in blocked), "Blocked write or API attempt"
                                          result["result"] = "PASS"
                                      except Exception as exc:
                                          result["failure_type"] = type(exc).__name__
                                          print(f"R2_BROWSER {label} FAIL: {type(exc).__name__}", flush=True)
                                      finally:
                                          result["blocked_requests"] = len(blocked)
                                          result["page_errors"] = len(errors)
                                          try:
                                              shot = proof / (label + ".png")
                                              page.screenshot(path=str(shot), timeout=10000)
                                              result["screenshot_sha256"] = hashlib.sha256(shot.read_bytes()).hexdigest()
                                              assert shot.stat().st_size >= 1000
                                          except Exception:
                                              result["result"] = "FAIL"
                                              result["screenshot_error"] = True
                                          finally:
                                              context.close()
                                              print("R2_BROWSER " + json.dumps(result), flush=True)
                          finally:
                              browser.close()
              finally:
                  server.shutdown()
                  worker.join(timeout=5)
                  (proof / "matrix.json").write_text(json.dumps(results, indent=2))
          assert len(results) == 8 and all(r["result"] == "PASS" for r in results), "Browser matrix incomplete or failed"
          print("R2_BROWSER_MATRIX_PASS 8/8")
          PY
      - name: Retain synthetic first-use screenshots and matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-browser-first-use-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r2-browser-proof/
          retention-days: 14
          if-no-files-found: warn

  django-pg16-baseline:
    needs: snapshot-source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_r2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_r2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-r2-synthetic-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_r2_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      FIREBASE_CREDENTIALS_PATH: ""
      ENABLE_FIREBASE_MIGRATION: "False"
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      KIMI_API_KEY: ""
      LLM_PROVIDER: fallback
      USE_KIMI: "False"
      MEDICAL_PILOT_MODE: "False"
      LLM_MEDICAL_STREAMING: "False"
      NARRATION_PROTECTED_PROVIDER_SHADOW: "False"
      NARRATION_PROTECTED_PROVIDER_INTERNAL_LIVE: "False"
      ALLOW_INSULIN_ADVICE: "False"
      ALLOW_DIAGNOSIS: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing requirements and report resolved versions
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze
      - name: Guard isolated database and validate schema
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@127.0.0.1:5432/iamina_r2_ci'
          test ! -e ../.env
          python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql'; assert connection.settings_dict['HOST'] == '127.0.0.1'; assert connection.settings_dict['NAME'] == 'iamina_r2_ci'; connection.ensure_connection(); assert 160000 <= connection.pg_version < 170000; print('R2_PG16_ISOLATED_PASS')"
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py makemigrations --check --dry-run
      - name: Targeted synthetic health regression
        run: python -m pytest diabetes/tests/test_health_endpoint.py --tb=short -q
      - name: Targeted synthetic PostgreSQL and egress regressions
        run: |
          python -m pytest --tb=short -q \
            diabetes/tests/test_entries.py \
            diabetes/tests/test_d7_profile_http_isolation.py \
            core/tests/test_ai_egress_boundary_gate.py

