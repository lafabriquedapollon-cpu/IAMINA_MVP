                                                      page.screenshot(path=str(candidate), timeout=10000)
                                                      metrics = assess_frame(candidate,width,height,reference_label)
                                                      resize_frames.append(dict(file=candidate.name,
                                                          monotonic_ns=time.monotonic_ns(),
