                                              frames = []
                                              for attempt in range(12):
                                                  candidate = proof / (label + "-attempt-" + str(attempt + 1) + ".png")
                                                  page.screenshot(path=str(candidate), timeout=10000)
                                                  metrics = assess_frame(candidate, width, height, reference_label)
                                                  frame = dict(file=candidate.name, attempt=attempt + 1,
                                                               monotonic_ns=time.monotonic_ns(),
                                                               sha256=hashlib.sha256(candidate.read_bytes()).hexdigest(),
                                                               metrics=metrics)
                                                  frames.append(frame)
                                                  result["frames"] = frames
                                                  result.update(metrics)
                                                  if fixture:
                                                      # Diagnostic-only: require two identical structurally complete frames.
                                                      # Keep the product reference verdict separately, never promote it.
                                                      if not metrics["old_pixel_gate"]:
                                                          paint_streak = 0
                                                      elif len(frames) > 1 and frames[-2]["metrics"]["rgb_sha256"] == metrics["rgb_sha256"]:
                                                          paint_streak += 1
                                                      else:
                                                          paint_streak = 1
                                                  else:
                                                      paint_streak = paint_streak + 1 if metrics["complete"] else 0
                                                  result["paint_streak"] = paint_streak
                                                  shutil.copyfile(candidate, shot)
                                                  if paint_streak >= 2:
                                                      break
                                                  page.wait_for_timeout(500)
                                              result["screenshot_sha256"] = hashlib.sha256(shot.read_bytes()).hexdigest()
                                              assert shot.stat().st_size >= 1000
                                              assert paint_streak >= 2, "Reference RGB / logo / card paint gate failed"
                                              if fixture:
                                                  result["fixture_initial_rgb"] = frames[-1]["metrics"]["rgb_sha256"]
                                                  result["semantics_at_initial_capture"] = observe_semantics(page)
                                                  assert_fixture_semantics(result["semantics_at_initial_capture"])
                                              # Mandatory viewport round-trip on every targeted AR mobile case.
                                              # Keep the initial verdict and all post-resize frames separate.
                                              if reference_label == "webkit-ar-MA-390x844":
