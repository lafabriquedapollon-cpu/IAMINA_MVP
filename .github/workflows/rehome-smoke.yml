                                                          page.screenshot(path=str(path), timeout=10000)
                                                          return dict(file=path.name, sha256=hashlib.sha256(path.read_bytes()).hexdigest(),
                                                                      metrics=assess_frame(path,width,height,reference_label))
                                                      # Hide the native logo element only; preserve layout.
                                                      diagnostic["hidden_logo_count"] = page.evaluate("""() => {
