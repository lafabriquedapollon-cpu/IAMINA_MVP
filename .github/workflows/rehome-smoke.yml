                  # cannot satisfy the verdict of the next case.
                  for event, count_key in (("late_js_error", "page_errors"),
                          ("late_http_block", "blocked_requests"),
                          ("late_websocket_block", "websocket_attempts")):
                      context = browser.new_context(service_workers="block")
                      page, verdict = attach_guard(context, origin)
                      try:
                          print("R2_NEGATIVE_START " + engine + " " + event, flush=True)
                          response = page.goto(origin + "/__r2_guard_fixture", timeout=10000)
                          assert response and response.status == 200
                          assert verdict()["late_event_gate"] == "PASS", "negative fixture precondition"
                          if event == "late_js_error":
                              page.evaluate("() => setTimeout(() => { throw new Error('R2 synthetic late error'); }, 25)")
                          elif event == "late_http_block":
                              page.evaluate("(url) => fetch(url).catch(() => null)", origin + "/api/r2-negative")
                          else:
                              page.evaluate("(url) => { setTimeout(() => { const socket = new WebSocket(url); socket.onerror = () => {}; }, 25); }",
                                            origin.replace("http:", "ws:") + "/r2-negative")
                          for _ in range(20):
                              page.wait_for_timeout(100)
                              if verdict()[count_key] > 0:
                                  break
                          print("R2_NEGATIVE_BEFORE_CLOSE " + engine + " " + event + " " + json.dumps(verdict()), flush=True)
                      finally:
                          context.close()
