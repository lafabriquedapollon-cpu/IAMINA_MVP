                                                          for frame in resize_frames), "Fixture post-resize pixels changed or incomplete"
                                                  else:
                                                      assert all(frame["metrics"]["complete"] for frame in resize_frames), "Post-resize visual gate failed"
                                                  result["resize_gate"] = "PASS"
                                          except Exception:
