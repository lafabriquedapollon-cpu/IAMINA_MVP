          import 'l10n/app_localizations.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(MaterialApp(
              title: 'IAMINA synthetic enrollment render probe',
              locale: const Locale('ar'),
              theme: AminaVisualLanguage.harmonize(AminaTheme.light),
              themeMode: ThemeMode.light,
              localizationsDelegates: AppLocalizations.localizationsDelegates,
              supportedLocales: AppLocalizations.supportedLocales,
              debugShowCheckedModeBanner: false,
              home: Builder(builder: (context) {
                final mode = Uri.base.queryParameters['r2_direction'];
                if (mode != 'rtl' && mode != 'ltr') {
                  throw StateError('Missing or invalid diagnostic direction');
                }
                return Directionality(
                  textDirection: mode == 'rtl' ? TextDirection.rtl : TextDirection.ltr,
                  child: Builder(builder: (context) {
                    debugPrint('R2_DIRECTION_ACTUAL=${Directionality.of(context).name};locale=${Localizations.localeOf(context).languageCode}');
                    return const LocalDeviceEnrollmentScreen();
                  }),
                );
              }),
            ));
          }
          DART
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path
          workflow = Path(".github/workflows/rehome-smoke.yml").read_text()
          marker = '"$RUNNER_TEMP/r2-browser-venv/bin/python" - ' + "<<'PY'\n"
          assert workflow.count(marker) == 1
          script = textwrap.dedent(workflow.split(marker,1)[1].split("\n          PY",1)[0])
          compile(script, "<r2-isolated-screen>", "exec")
          (Path(os.environ["RUNNER_TEMP"]) / "r2-screen-fixture.py").write_text(script)
          PY
          (cd frontend && flutter build web --release --no-pub --no-web-resources-cdn --target=lib/r2_enrollment_probe.dart --output="$R2_SCREEN_FIXTURE_WEB" --dart-define=API_BASE_URL=http://127.0.0.1:8000)
          git diff --exit-code -- "$screen"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          web = Path(os.environ["R2_SCREEN_FIXTURE_WEB"])
          proof = Path(os.environ["RUNNER_TEMP"]) / "r2-enrollment-fixture"
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          assert (web/"main.dart.js").is_file()
          (proof/"fixture-entry.dart").write_bytes(Path("frontend/lib/r2_enrollment_probe.dart").read_bytes())
          (proof/"fixture-build.json").write_text(json.dumps({
              "source_sha": os.environ["EXPECTED_SHA"],
              "screen_sha256": digest(Path("frontend/lib/features/auth/local_device_enrollment_screen.dart")),
              "entry_sha256": digest(proof/"fixture-entry.dart"),
              "build_files": {p.relative_to(web).as_posix():digest(p) for p in sorted(web.rglob("*")) if p.is_file()},
              "diagnostic_only": True,
              "interaction_disabled_by_test_scope": True,
          },indent=2))
          PY
          # Same fixture, SDK, browser, locale, semantics and guard; direction is the only arm variable.
          rtl_status=0
          ltr_status=0
          R2_FIXTURE_DIRECTION=rtl R2_FIXTURE_SEMANTICS=on "$RUNNER_TEMP/r2-browser-venv/bin/python" "$RUNNER_TEMP/r2-screen-fixture.py" || rtl_status=$?
          R2_FIXTURE_DIRECTION=ltr R2_FIXTURE_SEMANTICS=on "$RUNNER_TEMP/r2-browser-venv/bin/python" "$RUNNER_TEMP/r2-screen-fixture.py" || ltr_status=$?
          printf 'R2_DIRECTION_ARMS rtl=%s ltr=%s\n' "$rtl_status" "$ltr_status"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          proof = Path(os.environ["RUNNER_TEMP"]) / "r2-enrollment-fixture"
          web = Path(os.environ["R2_SCREEN_FIXTURE_WEB"])
          expected = json.loads((proof/"fixture-build.json").read_text())["build_files"]
          actual = {p.relative_to(web).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(web.rglob("*")) if p.is_file()}
          assert actual == expected, "Fixture build changed during experiment"
          PY
          test "$rtl_status" -eq 0 && test "$ltr_status" -eq 0
      - name: Retain isolated enrollment screen diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-enrollment-fixture-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r2-enrollment-fixture/
          retention-days: 14
          if-no-files-found: ignore

      # B already failed twice; retain the experiment for reproducibility,
      # but do not rebuild a known rejected candidate on every diagnostic run.
      - name: Isolated B experiment without native logo platform view
        if: ${{ false }}
        timeout-minutes: 12
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          R2_AB_VARIANT: canvas-only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f "$RUNNER_TEMP/r2-browser-proof/webkit-ar-MA-390x844.png"
          mkdir -p "$RUNNER_TEMP/r2-ab-canvas-only"
          src=frontend/lib/features/auth/local_device_enrollment_screen.dart
          git diff --exit-code -- "$src"
          restore_source() {
            git show "HEAD:$src" > "$src"
            git diff --exit-code -- "$src"
          }
          trap restore_source EXIT
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          p = Path("frontend/lib/features/auth/local_device_enrollment_screen.dart")
          original = p.read_bytes()
          old = b"WebHtmlElementStrategy.prefer,"
          new = b"WebHtmlElementStrategy.never,"
          assert original.count(old) == 1
          modified = original.replace(old, new)
          p.write_bytes(modified)
          proof = Path(os.environ["RUNNER_TEMP"]) / "r2-ab-canvas-only"
          (proof / "experiment.json").write_text(json.dumps({
              "source_sha": os.environ["EXPECTED_SHA"],
              "variant": "WebHtmlElementStrategy.prefer -> never",
              "original_source_sha256": hashlib.sha256(original).hexdigest(),
              "modified_source_sha256": hashlib.sha256(modified).hexdigest(),
              "diagnostic_only": True,
          }, indent=2))
          PY
          git diff --stat -- "$src"
          (cd frontend && flutter build web --release --no-pub --no-web-resources-cdn --dart-define=API_BASE_URL=http://127.0.0.1:8000)
          # Reuse the exact baseline harness, with only the explicit B mode enabled.
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path
          workflow = Path(".github/workflows/rehome-smoke.yml").read_text()
          marker = '"$RUNNER_TEMP/r2-browser-venv/bin/python" - <<\'PY\'\n'
          assert workflow.count(marker) == 1
          script = workflow.split(marker,1)[1].split("\n          PY",1)[0]
          script = textwrap.dedent(script)
          compile(script, "<r2-ab>", "exec")
          (Path(os.environ["RUNNER_TEMP"]) / "r2-ab-harness.py").write_text(script)
          PY
          "$RUNNER_TEMP/r2-browser-venv/bin/python" "$RUNNER_TEMP/r2-ab-harness.py"
      - name: Retain isolated B experiment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-ab-canvas-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r2-ab-canvas-only/
          retention-days: 14
          if-no-files-found: ignore

  django-pg16-baseline:
    needs: snapshot-source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_r2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_r2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-r2-synthetic-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_r2_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      FIREBASE_CREDENTIALS_PATH: ""
      ENABLE_FIREBASE_MIGRATION: "False"
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      KIMI_API_KEY: ""
      LLM_PROVIDER: fallback
      USE_KIMI: "False"
      MEDICAL_PILOT_MODE: "False"
      LLM_MEDICAL_STREAMING: "False"
      NARRATION_PROTECTED_PROVIDER_SHADOW: "False"
      NARRATION_PROTECTED_PROVIDER_INTERNAL_LIVE: "False"
      ALLOW_INSULIN_ADVICE: "False"
      ALLOW_DIAGNOSIS: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing requirements and report resolved versions
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze
      - name: Guard isolated database and validate schema
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@127.0.0.1:5432/iamina_r2_ci'
          test ! -e ../.env
          python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql'; assert connection.settings_dict['HOST'] == '127.0.0.1'; assert connection.settings_dict['NAME'] == 'iamina_r2_ci'; connection.ensure_connection(); assert 160000 <= connection.pg_version < 170000; print('R2_PG16_ISOLATED_PASS')"
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py makemigrations --check --dry-run
      - name: Targeted synthetic health regression
        run: python -m pytest diabetes/tests/test_health_endpoint.py --tb=short -q
      - name: Targeted synthetic PostgreSQL and egress regressions
        run: |
          python -m pytest --tb=short -q \
            diabetes/tests/test_entries.py \
            diabetes/tests/test_d7_profile_http_isolation.py \
            core/tests/test_ai_egress_boundary_gate.py

