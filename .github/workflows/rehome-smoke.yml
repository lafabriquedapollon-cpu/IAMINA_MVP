                      if event == "late_websocket_block":
                          assert not websocket_upstream_hits, "WebSocket reached local upstream"
                      assert state[count_key] > 0 and state["late_event_gate"] == "FAIL", event + " accepted"
                      assert all(state[k] == 0 for k in ("page_errors", "blocked_requests", "websocket_attempts")
                                 if k != count_key), event + " not isolated"
                      checks.append(dict(name=event, result="PASS", observed=state))
              finally:
                  (proof / (engine + "-negative-matrix.json")).write_text(json.dumps(checks, indent=2))
              assert len(checks) == 6
              print("R2_NEGATIVE_PASS " + engine + " 6/6", flush=True)

          results = []
          websocket_upstream_hits = []
          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=str(web), **kwargs)
              def do_GET(self):
                  if self.path == "/r2-negative":
                      websocket_upstream_hits.append(True)
                      self.send_error(403)
                  elif self.path == "/__r2_guard_fixture":
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.end_headers()
                      self.wfile.write(b"<!doctype html><title>R2 guard fixture</title>")
                  else:
                      super().do_GET()

              def log_message(self, *_args):
                  pass

          with http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler) as server:
              worker = threading.Thread(target=server.serve_forever, daemon=True)
              worker.start()
              origin = f"http://127.0.0.1:{server.server_address[1]}"
              try:
                  with sync_playwright() as pw:
