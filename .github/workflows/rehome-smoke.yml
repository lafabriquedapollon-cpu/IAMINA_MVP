name: IAMINA Rehome Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/rehome-smoke.yml'
      - 'backend/**'
      - 'scripts/**'
      - 'frontend/**'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest checked-out source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'SOURCE_SHA=%s\n' "$actual_sha"

      - name: Verify source tree and Python syntax (static only)
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          root = Path('.')
          for name in ('frontend/pubspec.yaml', 'backend/manage.py'):
              if not (root / name).is_file():
                  raise SystemExit(f'Missing required source: {name}')
          files = [*Path('backend').rglob('*.py'), *Path('scripts').rglob('*.py')]
          if len(files) < 900:
              raise SystemExit(f'Unexpected Python source count: {len(files)}')
          for item in files:
              ast.parse(item.read_text(encoding='utf-8'), filename=str(item))
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = [p for p in tracked if p and (Path(p).name.startswith('.env') or p.endswith(('.pem', '.p12', '.pfx', '.sqlite', '.sqlite3')))]
          if forbidden:
              raise SystemExit(f'Forbidden tracked paths: {len(forbidden)} (names withheld)')
          workflows = [p.name for p in Path('.github/workflows').iterdir() if p.is_file()]
          if workflows != ['rehome-smoke.yml']:
              raise SystemExit('Unexpected active workflow(s)')
          print(f'SOURCE_CONTRACT_PASS: {len(files)} Python files parsed; tracked path guard PASS')
          PY

      - name: Run independent standard-library source regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -q

  flutter-web-baseline:
    needs: snapshot-source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      CI: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest source and install pinned Flutter SDK
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
          git clone --depth 1 --branch 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = cc0734ac716fbb8b90f3f9db8020958b1553afa7
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Resolve exact locked dependencies
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos --no-pub
      - name: Targeted synthetic Flutter VM regressions
        run: |
          flutter test --no-pub --reporter expanded \
            test/data/drift/patient_vault_scope_test.dart \
            test/data/drift/patient_vault_profile_write_isolation_test.dart \
            test/services/patient_vault_session_controller_test.dart \
            test/services/sync_service_test.dart \
            test/local_device_enrollment_ui_contract_test.dart

      - name: Build Web without deployment or CDN
        run: flutter build web --release --no-pub --no-web-resources-cdn --dart-define=API_BASE_URL=http://127.0.0.1:8000
      - name: Verify PWA files
        run: |
          set -euo pipefail
          for f in index.html manifest.json flutter_bootstrap.js main.dart.js iamina_service_worker.js sqlite3.wasm drift_worker.js; do
            test -s "build/web/$f"
          done
          echo R2_FLUTTER_BUILD_PASS


      - name: Install pinned Playwright Chromium and WebKit
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r2-browser-venv"
          "$RUNNER_TEMP/r2-browser-venv/bin/python" -m pip install playwright==1.55.0 Pillow==11.3.0
          "$RUNNER_TEMP/r2-browser-venv/bin/python" -m playwright install --with-deps chromium webkit
      - name: Real browser first-use baseline FR and AR
        timeout-minutes: 8
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          "$RUNNER_TEMP/r2-browser-venv/bin/python" - <<'PY'
          import hashlib
          import http.server
          import json
          import os
          import pathlib
          import threading
          import time
          import shutil
          from PIL import Image
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout

          web = pathlib.Path("frontend/build/web").resolve()
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "r2-browser-proof"
          proof.mkdir()
          assert (web / "index.html").is_file()
          logo_path = web / "assets/assets/images/iamina_logo_vertical.png"
          assert logo_path.is_file(), "Logo missing from compiled assets"
          with Image.open(logo_path) as logo_source:
              logo_source.load()
              print("R2_LOGO_SOURCE " + json.dumps({
                  "size": list(logo_source.size), "mode": logo_source.mode,
                  "sha256": hashlib.sha256(logo_path.read_bytes()).hexdigest(),
              }), flush=True)
          # Immutable, reviewed RGB references from run 45378100000 / artifact 14912323052,
          # independently confirmed in artifact 14916834190. No automatic rebaseline.
          reference_rgb = {
              "chromium-ar-MA-1180x860": "e52a1785cd37a4993aea90bb63f239accbddac09667e107032e31d48c381994d",
              "chromium-ar-MA-390x844": "eef3a466b44749fc173143bca056c862c99c91d4827feddf41fb219e8ab965bb",
              "chromium-fr-FR-1180x860": "49e5c1c6c5a2827ac226d3d26356c0478bb9d2eb3463ca26add2ff7c61db9de8",
              "chromium-fr-FR-390x844": "1f33f487022a813e8cc1324486732c25b952fc72d010f9bed8f2f66c85abf49f",
              "webkit-ar-MA-1180x860": "db8b5c8fe925ef18d7d33ad893c47843353b0fef71c4cf633632c932e2bc58d7",
              "webkit-ar-MA-390x844": "6e835341c91af6c0fc933fef5db7a092cfa1b579033ee0b8298fd76f0a076046",
              "webkit-fr-FR-1180x860": "f8fda05aa25417114b20e8d9a737457193de2377010700b48dfe5419f5487a0a",
              "webkit-fr-FR-390x844": "959ce31f26975c2cfebcad77742f640c0d13c4786718bc8dbd260a0849fc9257",
          }
          def assess_frame(path, width, height, label):
              with Image.open(path) as png:
                  rgb = png.convert("RGB")
                  assert rgb.size == (width, height)
                  logo = rgb.crop((width // 2 - 66, 22, width // 2 + 66, 154))
                  card = rgb.crop((0, 154, width, height))
                  def teal_count(image):
                      return sum(1 for r, g, b in image.getdata()
                                 if r < 90 and g < 160 and b < 150 and g > r + 15)
                  def spread(image):
                      return max(hi - lo for lo, hi in image.getextrema())
                  digest = hashlib.sha256(rgb.tobytes()).hexdigest()
                  metrics = dict(logo_teal_pixels=teal_count(logo), pixel_range=spread(rgb),
                                 card_teal_pixels=teal_count(card), card_pixel_range=spread(card),
                                 rgb_sha256=digest, reference_match=digest == reference_rgb[label])
              metrics["old_pixel_gate"] = (metrics["logo_teal_pixels"] >= 2000 and
                  metrics["pixel_range"] >= 80 and metrics["card_teal_pixels"] >= 5000 and
                  metrics["card_pixel_range"] >= 80)
              metrics["complete"] = metrics["old_pixel_gate"] and metrics["reference_match"]
              return metrics

          def attach_guard(context, origin):
              blocked, errors, websocket_attempts, console = [], [], [], []
              def local_only(route):
                  req = route.request
                  if req.url.startswith(("data:", "blob:")):
                      route.continue_()
                  elif (req.url.startswith(origin + "/") and req.method in ("GET", "HEAD")
                        and "/api/" not in req.url.lower()):
                      route.continue_()
                  else:
                      blocked.append(req.method)
                      route.abort()
              def block_ws(ws):
                  # A routed WebSocket is mocked by default. Never connect to its
                  # upstream server. Avoid a synchronous close inside the callback.
                  websocket_attempts.append(True)
                  print("R2_WS_ROUTE_INTERCEPTED", flush=True)
              # Register routing before any page is created (Playwright API recommendation).
              context.route("**/*", local_only)
              context.route_web_socket("**/*", block_ws)
              page = context.new_page()
              page.on("pageerror", lambda err: errors.append(type(err).__name__))
              page.on("console", lambda msg: console.append(msg.type)
                      if msg.type in ("error", "warning") else None)
              def verdict():
                  return dict(blocked_requests=len(blocked), page_errors=len(errors),
                              websocket_attempts=len(websocket_attempts),
                              console_warning_count=console.count("warning"),
                              console_error_count=console.count("error"),
                              console_warning_error_count=len(console),
                              late_event_gate="FAIL" if blocked or errors or websocket_attempts else "PASS")
              return page, verdict

          def require_cta(page, cta, timeout=30000):
              button = page.get_by_role("button", name=cta, exact=True)
              button.wait_for(state="visible", timeout=timeout)
              assert button.is_enabled()
              return button

          def negative_cases(browser, engine, origin):
              context = browser.new_context(viewport={"width":390,"height":844},
                                            device_scale_factor=1, service_workers="block")
              page, verdict = attach_guard(context, origin)
              checks = []
              label = engine + "-fr-FR-390x844"
              try:
                  for name, card in (("logo_only", ""), ("fake_teal_card",
                          '<div style="position:absolute;top:200px;left:90px;width:210px;height:100px;background:#007c68"></div>')):
                      page.set_content('<body style="margin:0;background:white"><div style="position:absolute;top:22px;left:145px;width:100px;height:100px;background:#007c68"></div>' + card + '</body>')
                      shot = proof / (engine + "-negative-" + name + ".png")
                      page.screenshot(path=str(shot))
                      metrics = assess_frame(shot,390,844,label)
                      assert not metrics["complete"], name + " accepted"
                      assert metrics["old_pixel_gate"] == (name == "fake_teal_card"), "negative fixture invalid"
                      checks.append(dict(name=name, result="PASS", metrics=metrics,
                                         screenshot_sha256=hashlib.sha256(shot.read_bytes()).hexdigest()))
                  try:
                      require_cta(page, "Continuer sans compte", timeout=300)
                  except PlaywrightTimeout:
                      checks.append(dict(name="missing_cta_fixture", result="PASS"))
                  else:
                      raise AssertionError("Missing CTA accepted")
              finally:
                  context.close()
              try:
                  # Each injection gets an independent fresh guard: a prior failure
                  # cannot satisfy the verdict of the next case.
                  for event, count_key in (("late_js_error", "page_errors"),
                          ("late_http_block", "blocked_requests"),
                          ("late_websocket_block", "websocket_attempts")):
                      context = browser.new_context(service_workers="block")
                      page, verdict = attach_guard(context, origin)
                      try:
                          print("R2_NEGATIVE_START " + engine + " " + event, flush=True)
                          response = page.goto(origin + "/__r2_guard_fixture", timeout=10000)
                          assert response and response.status == 200
                          assert verdict()["late_event_gate"] == "PASS", "negative fixture precondition"
                          if event == "late_js_error":
                              page.evaluate("() => setTimeout(() => { throw new Error('R2 synthetic late error'); }, 25)")
                          elif event == "late_http_block":
                              page.evaluate("(url) => fetch(url).catch(() => null)", origin + "/api/r2-negative")
                          else:
                              page.evaluate("(url) => { setTimeout(() => { const socket = new WebSocket(url); socket.onerror = () => {}; }, 25); }",
                                            origin.replace("http:", "ws:") + "/r2-negative")
                          for _ in range(20):
                              page.wait_for_timeout(100)
                              if verdict()[count_key] > 0:
                                  break
                          print("R2_NEGATIVE_BEFORE_CLOSE " + engine + " " + event + " " + json.dumps(verdict()), flush=True)
                      finally:
                          context.close()
                      state = verdict()
                      if event == "late_websocket_block":
                          assert not websocket_upstream_hits, "WebSocket reached local upstream"
                      assert state[count_key] > 0 and state["late_event_gate"] == "FAIL", event + " accepted"
                      assert all(state[k] == 0 for k in ("page_errors", "blocked_requests", "websocket_attempts")
                                 if k != count_key), event + " not isolated"
                      checks.append(dict(name=event, result="PASS", observed=state))
              finally:
                  (proof / (engine + "-negative-matrix.json")).write_text(json.dumps(checks, indent=2))
              assert len(checks) == 6
              print("R2_NEGATIVE_PASS " + engine + " 6/6", flush=True)

          results = []
          websocket_upstream_hits = []
          class Handler(http.server.SimpleHTTPRequestHandler):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, directory=str(web), **kwargs)
              def do_GET(self):
                  if self.path == "/r2-negative":
                      websocket_upstream_hits.append(True)
                      self.send_error(403)
                  elif self.path == "/__r2_guard_fixture":
                      self.send_response(200)
                      self.send_header("Content-Type", "text/html; charset=utf-8")
                      self.end_headers()
                      self.wfile.write(b"<!doctype html><title>R2 guard fixture</title>")
                  else:
                      super().do_GET()

              def log_message(self, *_args):
                  pass

          with http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler) as server:
              worker = threading.Thread(target=server.serve_forever, daemon=True)
              worker.start()
              origin = f"http://127.0.0.1:{server.server_address[1]}"
              try:
                  with sync_playwright() as pw:
                      # Four additional cold WebKit processes, not retries of failed cases.
                      for engine, repetition in [("chromium", 0), ("webkit", 0)] + [
                              ("webkit", n) for n in range(1, 5)]:
                          browser = getattr(pw, engine).launch(headless=True)
                          try:
                              if repetition == 0:
                                  negative_cases(browser, engine, origin)
                              locales = (("ar-MA", "المتابعة بدون حساب"),) if repetition else (
                                  ("fr-FR", "Continuer sans compte"), ("ar-MA", "المتابعة بدون حساب"))
                              viewports = ((390, 844),) if repetition else ((390, 844), (1180, 860))
                              for locale, cta in locales:
                                  for width, height in viewports:
                                      reference_label = f"{engine}-{locale}-{width}x{height}"
                                      label = reference_label + (f"-cold-{repetition}" if repetition else "")
                                      result = dict(engine=engine, browser_version=browser.version,
                                                    repetition=repetition, label=label, reference_label=reference_label,
                                                    locale=locale, viewport=[width, height],
                                                    source_sha=os.environ["EXPECTED_SHA"],
                                                    result="FAIL")
                                      results.append(result)
                                      context = browser.new_context(
                                          locale=locale, viewport={"width": width, "height": height},
                                          device_scale_factor=1, service_workers="block")
                                      page, verdict = attach_guard(context, origin)
                                      asset_responses = []
                                      page.on("response", lambda res: asset_responses.append(res.status)
                                              if res.url.split("?")[0].endswith("/iamina_logo_vertical.png") else None)
                                      try:
                                          result["stage"] = "navigate"
                                          response = page.goto(origin, wait_until="domcontentloaded", timeout=60000)
                                          assert response and response.status == 200
                                          result["stage"] = "flutter-view"
                                          page.wait_for_selector("flutter-view, flt-glass-pane", timeout=60000)
                                          result["stage"] = "semantics"
                                          placeholder = page.locator("flt-semantics-placeholder")
                                          if placeholder.count():
                                              placeholder.evaluate("(element) => element.click()")
                                          result["stage"] = "localized-cta"
                                          button = require_cta(page, cta)
                                          page.wait_for_timeout(500)
                                          assert verdict()["late_event_gate"] == "PASS", "Initial browser guard failed"
                                          result["stage"] = "assertions-complete"
                                          result["result"] = "PASS"
                                      except Exception as exc:
                                          result["failure_type"] = type(exc).__name__
                                          print(f"R2_BROWSER {label} FAIL: {type(exc).__name__}", flush=True)
                                      finally:
                                          try:
                                              shot = proof / (label + ".png")
                                              paint_streak = 0
                                              frames = []
                                              for attempt in range(12):
                                                  candidate = proof / (label + "-attempt-" + str(attempt + 1) + ".png")
                                                  page.screenshot(path=str(candidate), timeout=10000)
                                                  metrics = assess_frame(candidate, width, height, reference_label)
                                                  frame = dict(file=candidate.name, attempt=attempt + 1,
                                                               monotonic_ns=time.monotonic_ns(),
                                                               sha256=hashlib.sha256(candidate.read_bytes()).hexdigest(),
                                                               metrics=metrics)
                                                  frames.append(frame)
                                                  result["frames"] = frames
                                                  result.update(metrics)
                                                  paint_streak = paint_streak + 1 if metrics["complete"] else 0
                                                  result["paint_streak"] = paint_streak
                                                  shutil.copyfile(candidate, shot)
                                                  if paint_streak >= 2:
                                                      break
                                                  page.wait_for_timeout(500)
                                              result["screenshot_sha256"] = hashlib.sha256(shot.read_bytes()).hexdigest()
                                              assert shot.stat().st_size >= 1000
                                              assert paint_streak >= 2, "Reference RGB / logo / card paint gate failed"
                                          except Exception:
                                              result["result"] = "FAIL"
                                              result["screenshot_error"] = True
                                          finally:
                                              # Diagnostic-only experiments AFTER the original verdict.
                                              # A recovered screenshot must never promote this failed case.
                                              if result.get("screenshot_error") and engine == "webkit" and locale == "ar-MA" and width == 390:
                                                  diagnostic = {}
                                                  result["composition_diagnostic"] = diagnostic
                                                  try:
                                                      diagnostic["dom_before"] = page.evaluate("""() => {
                                                        const nodes = [];
                                                        const walk = root => {
                                                          for (const e of root.querySelectorAll('*')) {
                                                            if (e.shadowRoot) walk(e.shadowRoot);
                                                            if (['CANVAS','IMG','FLT-GLASS-PANE','FLT-SCENE','FLT-PLATFORM-VIEW','FLT-PLATFORM-VIEW-SLOT','FLUTTER-VIEW'].includes(e.tagName)) {
                                                              const r = e.getBoundingClientRect(), s = getComputedStyle(e);
                                                              nodes.push({tag:e.tagName,x:r.x,y:r.y,w:r.width,h:r.height,
                                                                display:s.display,visibility:s.visibility,opacity:s.opacity,
                                                                logo:e.tagName==='IMG' && e.src.includes('iamina_logo_vertical.png')});
                                                            }
                                                          }
                                                        };
                                                        walk(document);
                                                        return nodes.slice(0,80);
                                                      }""")
                                                      def diagnostic_shot(name):
                                                          path = proof / (label + "-diag-" + name + ".png")
                                                          page.screenshot(path=str(path), timeout=10000)
                                                          return dict(file=path.name, sha256=hashlib.sha256(path.read_bytes()).hexdigest(),
                                                                      metrics=assess_frame(path,width,height,reference_label))
                                                      # Hide the native logo element only; preserve layout.
                                                      diagnostic["hidden_logo_count"] = page.evaluate("""() => {
                                                        const matches = [];
                                                        const walk = root => {
                                                          for (const e of root.querySelectorAll('*')) {
                                                            if (e.shadowRoot) walk(e.shadowRoot);
                                                            if (e.tagName === 'IMG' && e.src.includes('iamina_logo_vertical.png')) {
                                                              matches.push([e,e.style.visibility]);
                                                              e.style.visibility = 'hidden';
                                                            }
                                                          }
                                                        };
                                                        walk(document);
                                                        window.__r2HiddenLogo = matches;
                                                        return matches.length;
                                                      }""")
                                                      try:
                                                          page.wait_for_timeout(350)
                                                          diagnostic["hide_logo"] = diagnostic_shot("hide-logo")
                                                      finally:
                                                          page.evaluate("""() => {
                                                            for (const [e,v] of window.__r2HiddenLogo || []) e.style.visibility=v;
                                                            delete window.__r2HiddenLogo;
                                                          }""")
                                                      page.wait_for_timeout(350)
                                                      diagnostic["restored_logo"] = diagnostic_shot("restore-logo")
                                                      # Force a viewport invalidation, then restore exact original geometry.
                                                      try:
                                                          page.set_viewport_size({"width":width+1,"height":height})
                                                          page.wait_for_timeout(350)
                                                      finally:
                                                          page.set_viewport_size({"width":width,"height":height})
                                                      page.wait_for_timeout(350)
                                                      diagnostic["resize_restore"] = diagnostic_shot("resize-restore")
                                                  except Exception as exc:
                                                      diagnostic["error_type"] = type(exc).__name__
                                                  print("R2_COMPOSITION_DIAGNOSTIC " + json.dumps(diagnostic), flush=True)
                                              # Probe the same asset independently of Flutter's renderer.
                                              result["app_logo_http_statuses"] = list(asset_responses)
                                              try:
                                                  result["asset_probe"] = page.evaluate("""async () => {
                                                    const path = '/assets/assets/images/iamina_logo_vertical.png';
                                                    const response = await fetch(path);
                                                    const bytes = await response.arrayBuffer();
                                                    const blob = new Blob([bytes], {type: 'image/png'});
                                                    const url = URL.createObjectURL(blob);
                                                    try {
                                                      const image = new Image();
                                                      image.src = url;
                                                      await image.decode();
                                                      const canvas = document.createElement('canvas');
                                                      canvas.width = image.naturalWidth;
                                                      canvas.height = image.naturalHeight;
                                                      const ctx = canvas.getContext('2d');
                                                      ctx.drawImage(image, 0, 0);
                                                      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                                                      let teal = 0, opaque = 0;
                                                      for (let i = 0; i < pixels.length; i += 4) {
                                                        if (pixels[i+3] > 127) {
                                                          opaque++;
                                                          if (pixels[i] < 90 && pixels[i+1] < 160 &&
                                                              pixels[i+2] < 150 && pixels[i+1] > pixels[i] + 15) teal++;
                                                        }
                                                      }
                                                      return {status: response.status, bytes: bytes.byteLength,
                                                        width: canvas.width, height: canvas.height, opaque, teal};
                                                    } finally { URL.revokeObjectURL(url); }
                                                  }""")
                                              except Exception as exc:
                                                  result["asset_probe"] = {"error_type": type(exc).__name__}
                                              finally:
                                                  # Final counters include paint polling and the local asset probe.
                                                  # Close the context before recording the final verdict.
                                                  context.close()
                                                  result.update(verdict())
                                                  if result["late_event_gate"] != "PASS":
                                                      result["result"] = "FAIL"
                                              print("R2_BROWSER " + json.dumps(result), flush=True)
                          finally:
                              browser.close()
              finally:
                  server.shutdown()
                  worker.join(timeout=5)
                  (proof / "matrix.json").write_text(json.dumps(results, indent=2))
          baseline = [r for r in results if r["repetition"] == 0]
          cold = [r for r in results if r["engine"] == "webkit" and r["locale"] == "ar-MA"
                  and r["viewport"] == [390, 844]]
          assert len(results) == 12 and len(baseline) == 8, "Browser matrix incomplete"
          assert sorted(r["repetition"] for r in cold) == [0, 1, 2, 3, 4], "Cold-start matrix incomplete"
          assert all(r["result"] == "PASS" for r in results), "Browser matrix or cold starts failed"
          print("R2_BROWSER_MATRIX_PASS 8/8")
          print("R2_WEBKIT_AR_MOBILE_PASS 5/5")
          PY
      - name: Retain synthetic first-use screenshots and matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2-browser-first-use-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/r2-browser-proof/
          retention-days: 14
          if-no-files-found: warn

  django-pg16-baseline:
    needs: snapshot-source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iamina_r2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamina_r2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: amina.settings
      SECRET_KEY: ci-r2-synthetic-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iamina_r2_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      FIREBASE_CREDENTIALS_PATH: ""
      ENABLE_FIREBASE_MIGRATION: "False"
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      KIMI_API_KEY: ""
      LLM_PROVIDER: fallback
      USE_KIMI: "False"
      MEDICAL_PILOT_MODE: "False"
      LLM_MEDICAL_STREAMING: "False"
      NARRATION_PROTECTED_PROVIDER_SHADOW: "False"
      NARRATION_PROTECTED_PROVIDER_INTERNAL_LIVE: "False"
      ALLOW_INSULIN_ADVICE: "False"
      ALLOW_DIAGNOSIS: "False"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing requirements and report resolved versions
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip freeze
      - name: Guard isolated database and validate schema
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@127.0.0.1:5432/iamina_r2_ci'
          test ! -e ../.env
          python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql'; assert connection.settings_dict['HOST'] == '127.0.0.1'; assert connection.settings_dict['NAME'] == 'iamina_r2_ci'; connection.ensure_connection(); assert 160000 <= connection.pg_version < 170000; print('R2_PG16_ISOLATED_PASS')"
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py makemigrations --check --dry-run
      - name: Targeted synthetic health regression
        run: python -m pytest diabetes/tests/test_health_endpoint.py --tb=short -q
      - name: Targeted synthetic PostgreSQL and egress regressions
        run: |
          python -m pytest --tb=short -q \
            diabetes/tests/test_entries.py \
            diabetes/tests/test_d7_profile_http_isolation.py \
            core/tests/test_ai_egress_boundary_gate.py

